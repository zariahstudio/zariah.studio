<script src="/zariah-cart.js"></script>
<script>
(function(){
'use strict';
const cart=window.ZariahCart,root=document.getElementById('cartContent'),money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!cart){root.innerHTML='<div class="empty"><h2>Your bag is temporarily unavailable</h2><p>Please refresh the page and try again.</p></div>';return;}
function render(){
 const items=cart.read();cart.updateCount(items);
 if(!items.length){root.innerHTML='<div class="empty"><h2>Your bag is waiting</h2><p>Discover a piece that feels unmistakably yours.</p><a class="shop" href="/collections/all-bags/">Explore All Bags</a><a class="track-order-link" href="/pages/track-order/">Track an Existing Order →</a></div>';return;}
 const subtotal=cart.subtotal(items);
 root.innerHTML='<div class="cart-layout"><section><div class="cart-head"><span>Product</span><span>Quantity &amp; Total</span></div>'+items.map(x=>'<article class="item"><a href="/products/'+encodeURIComponent(x.id)+'/"><img src="'+esc(x.image)+'" alt="'+esc(x.name)+'" decoding="async"></a><div><a href="/products/'+encodeURIComponent(x.id)+'/" class="name">'+esc(x.name)+'</a><div class="meta">'+esc(x.id.toUpperCase())+'</div><div class="price">'+money(x.price)+'</div><div class="qty"><button type="button" data-action="minus" data-id="'+esc(x.id)+'" aria-label="Decrease quantity">−</button><span>'+x.qty+'</span><button type="button" data-action="plus" data-id="'+esc(x.id)+'" aria-label="Increase quantity">+</button></div></div><div class="item-end"><span class="line-total">'+money(x.price*x.qty)+'</span><button class="remove" type="button" data-action="remove" data-id="'+esc(x.id)+'">Remove</button></div></article>').join('')+'</section><aside class="summary"><h2>Order Summary</h2><div class="sumrow"><span>Subtotal</span><span>'+money(subtotal)+'</span></div><div class="sumrow"><span>Delivery</span><span>Confirmed at checkout</span></div><div class="sumrow total"><strong>Estimated Total</strong><strong>'+money(subtotal)+'</strong></div><a class="checkout" href="/pages/checkout/">Proceed to Checkout</a><a class="continue" href="/collections/all-bags/">Continue Shopping</a><a class="continue track-order-link" href="/pages/track-order/">Track an Existing Order →</a><p class="delivery-note">Cash on delivery is available. Delivery charge and availability will be confirmed with you before your order is placed.</p></aside></div>';
}
root.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const item=cart.read().find(entry=>entry.id===button.dataset.id);if(!item)return;
 let result;
 if(button.dataset.action==='plus')result=cart.setQuantity(item.id,item.qty+1);
 if(button.dataset.action==='minus')result=cart.setQuantity(item.id,item.qty-1);
 if(button.dataset.action==='remove')result=cart.remove(item.id);
 if(result?.ok)render();
});
window.addEventListener('storage',event=>{if(event.key===cart.key||event.key===null)render();});
render();
})();
</script>
