<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Checkout | ZARIAH Studio</title>
<meta name="description" content="Complete your ZARIAH Studio order with a simple guest checkout.">
<base href="/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf7f1;--ink:#292522;--muted:#81776f;--gold:#c5a06a;--line:#e8e0d7;--panel:#f4eee6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;font-weight:300}a{color:inherit;text-decoration:none}
.announcement{background:#77716d;color:#f0d6aa;text-align:center;padding:10px 14px;font-size:9px;letter-spacing:.16em}
header{height:82px;padding:0 clamp(18px,5vw,70px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font:500 30px 'Cormorant Garamond',serif;letter-spacing:.13em;text-align:center}.brand small{display:block;font:9px Inter,sans-serif;letter-spacing:.35em;text-align:center}
nav{display:flex;gap:25px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;align-items:center}
main{max-width:1160px;margin:auto;padding:42px 28px 85px}.crumb{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
h1{font:400 clamp(42px,6vw,62px)/1 'Cormorant Garamond',serif;margin:18px 0 8px}.intro{font-size:12px;color:var(--muted);margin:0 0 32px}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:55px;align-items:start}
.section-title{font:400 29px 'Cormorant Garamond',serif;margin:0 0 20px}.form-section{padding-bottom:27px;margin-bottom:27px;border-bottom:1px solid var(--line)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}
label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#665e57}
input,textarea,select{width:100%;border:1px solid #ded5ca;background:#fffdfa;padding:14px 13px;border-radius:0;font:300 12px Inter,sans-serif;color:var(--ink);outline:none;min-height:46px}
textarea{min-height:88px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px #c5a06a20}
.hint{font-size:10px;line-height:1.7;color:var(--muted);margin:9px 0 0}
.payment-card{border:1px solid var(--gold);background:#fffdfa;padding:17px;display:flex;gap:12px;align-items:flex-start}
.payment-card input{width:15px;min-height:15px;margin:2px 0 0;accent-color:var(--gold)}
.payment-card strong{display:block;font-size:11px;font-weight:500;margin-bottom:5px}.payment-card span{font-size:10px;color:var(--muted);line-height:1.6}
.summary{background:var(--panel);padding:26px 24px;position:sticky;top:20px}
.summary h2{font:400 29px 'Cormorant Garamond',serif;margin:0 0 20px}
.product{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #ded4c8}
.product img{width:62px;height:78px;object-fit:cover;background:#eee8e1}.product-name{font:400 19px/1.1 'Cormorant Garamond',serif}.product-meta{font-size:9px;color:var(--muted);margin-top:5px}.product-price{font-size:10px;white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);margin:15px 0}.row.total{border-top:1px solid #ded4c8;padding-top:18px;margin-top:18px;color:var(--ink);font-size:13px}
.submit{width:100%;border:0;background:var(--ink);color:#fff;padding:17px 12px;font:400 9px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-top:13px}
.submit:hover{background:#4b4138}.submit:disabled{opacity:.5;cursor:not-allowed}
.secure-note{font-size:9px;line-height:1.8;color:var(--muted);text-align:center;margin:15px 0 0}
.back{display:block;text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;margin-top:18px}
.empty{border:1px solid var(--line);padding:48px 20px;text-align:center}.empty h2{font:400 35px 'Cormorant Garamond',serif;margin:0 0 10px}.empty p{font-size:11px;color:var(--muted)}.empty a{display:inline-block;background:var(--ink);color:white;padding:14px 20px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-top:12px}
footer{border-top:1px solid var(--line);padding:25px;text-align:center;font-size:10px;color:var(--muted)}
@media(max-width:760px){header{height:auto;padding:16px;display:block;text-align:center}.brand{font-size:27px}nav{justify-content:center;flex-wrap:wrap;gap:12px 17px;margin-top:14px;font-size:9px}main{padding:30px 16px 60px}.layout{grid-template-columns:1fr;gap:28px}.summary{position:static;grid-row:1}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.summary{padding:22px 18px}}
</style>
<link rel="stylesheet" href="/assets/css/brand-typography.css?v=20261109"><link rel="stylesheet" href="/assets/css/mobile-navigation-refinement.css?v=20261110-mobile-ux2"><link rel="stylesheet" href="/assets/css/mobile-commerce-controls.css?v=20261110-mobile-ux3"><link rel="stylesheet" href="/assets/css/desktop-readability-refinement.css?v=20261110-desktop-type2"><link rel="stylesheet" href="/assets/css/desktop-editorial-redesign.css?v=20261110-editorial-v2"></head>
<body>
<div class="announcement">ZARIAH STUDIO · QUIET LUXURY, BEAUTIFULLY CARRIED</div>
<header><a class="brand" href="/">ZARIAH<small>STUDIO</small></a><nav><a href="/">Home</a><a href="/collections/all-bags/">All Bags</a><a href="/pages/cart/">Your Bag</a><a href="/pages/search/" aria-label="Search">Search</a></nav></header>
<main>
<div class="crumb"><a href="/">Home</a> / <a href="/pages/cart/">Your Bag</a> / Checkout</div>
<h1>Guest Checkout</h1><p class="intro">A few details, and your chosen pieces will be ready for confirmation.</p>
<div id="checkoutRoot"></div>
</main>
<footer>© ZARIAH Studio — A brand of InsightBridge · Proudly Made in Bangladesh</footer>
<script src="/zariah-supabase-loader.js"></script>
<script src="/storefront-config.js"></script>
<script src="/zariah-cart.js"></script>
<script>
(function(){
const root=document.getElementById('checkoutRoot'), money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const cart=window.ZariahCart ? window.ZariahCart.read() : [];
if(!window.ZariahCart){root.innerHTML='<div class="empty"><h2>Checkout is temporarily unavailable</h2><p>Please refresh the page and try again.</p></div>';return;}
if(!cart.length){root.innerHTML='<div class="empty"><h2>Your bag is empty</h2><p>Add a piece to your bag before proceeding to checkout.</p><a href="/collections/all-bags/">Explore All Bags</a></div>';return}
const subtotal=cart.reduce((sum,item)=>sum+(Number(item.price)||0)*(Number(item.qty)||0),0);
root.innerHTML=`
<div class="layout">
<form id="guestCheckout" novalidate>
<section class="form-section">
<h2 class="section-title">Contact Information</h2>
<div class="fields">
<div class="field full"><label for="fullName">Full Name *</label><input id="fullName" name="fullName" autocomplete="name" placeholder="Your full name" required maxlength="80"></div>
<div class="field"><label for="phone">Phone Number *</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required maxlength="16"></div>
<div class="field"><label for="email">Email Address (Optional)</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="100"></div>
</div><p class="hint">We will use your phone number to contact you about order confirmation and delivery.</p>
</section>
<section class="form-section">
<h2 class="section-title">Delivery Address</h2>
<div class="fields">
<div class="field"><label for="district">District / City *</label><input id="district" name="district" autocomplete="address-level2" placeholder="e.g. Chattogram" required maxlength="60"></div>
<div class="field"><label for="area">Area / Thana *</label><input id="area" name="area" placeholder="Your area or thana" required maxlength="80"></div>
<div class="field full"><label for="address">Full Address *</label><textarea id="address" name="address" autocomplete="street-address" placeholder="House, road, building, landmark..." required maxlength="400"></textarea></div>
<div class="field full"><label for="notes">Order Notes (Optional)</label><textarea id="notes" name="notes" placeholder="Any delivery instructions?" maxlength="300"></textarea></div>
</div>
</section>
<section class="form-section">
<h2 class="section-title">Payment Method</h2>
<div class="payment-card"><input type="radio" checked disabled aria-label="Cash on delivery selected"><div><strong>Cash on Delivery</strong><span>Pay when your order is delivered. Any delivery charge will be confirmed before dispatch.</span></div></div>
</section>
<button class="submit" type="submit">Continue to WhatsApp to Confirm Order</button>
<p class="hint">Your order request is saved securely first. Our team will confirm availability and delivery charge with you on WhatsApp.</p>
</form>
<aside class="summary">
<h2>Order Summary</h2>
<div>${cart.map(item=>`<div class="product"><img src="${String(item.image||'').replace(/"/g,'&quot;')}" alt="" decoding="async"><div><div class="product-name">${String(item.name||'ZARIAH Bag').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</div><div class="product-meta">Qty: ${Number(item.qty)||1}</div></div><div class="product-price">${money((Number(item.price)||0)*(Number(item.qty)||1))}</div></div>`).join('')}</div>
<div class="row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
<div class="row"><span>Delivery</span><span>To be confirmed</span></div>
<div class="row total"><strong>Estimated Total</strong><strong>${money(subtotal)}</strong></div>
<p class="secure-note">Guest checkout · No account required<br>Delivery charge will be confirmed by our team.</p>
<a class="back" href="/pages/cart/">Return to Bag</a>
</aside>
</div>`;
document.getElementById('guestCheckout').addEventListener('submit',async function(e){
 e.preventDefault();
 const form=e.currentTarget;
 if(!form.reportValidity())return;
 const button=form.querySelector('.submit');
 const data=new FormData(form);
 const phone=String(data.get('phone')||'').replace(/[\s()-]/g,'');
 if(!/^(?:\+?88)?01[3-9]\d{8}$/.test(phone)){
   document.getElementById('phone').setCustomValidity('Enter a valid Bangladesh mobile number.');
   document.getElementById('phone').reportValidity();
   document.getElementById('phone').setCustomValidity('');
   return;
 }
 button.disabled=true;
 button.textContent='CONNECTING SECURE CHECKOUT…';
 try{
   await window.ZARIAH_LOAD_SUPABASE();
   if(!window.supabase?.createClient||!window.ZARIAH_SUPABASE_CONFIG){
     throw new Error('Secure checkout is temporarily unavailable.');
   }
   button.textContent='SECURELY PLACING ORDER…';
   const cfg=window.ZARIAH_SUPABASE_CONFIG;
   const client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:false,autoRefreshToken:false}});
   let idempotencyKey='';
   try{
     idempotencyKey=sessionStorage.getItem('zariah_checkout_idempotency_v1')||'';
     if(!idempotencyKey){idempotencyKey=crypto.randomUUID();sessionStorage.setItem('zariah_checkout_idempotency_v1',idempotencyKey);}
   }catch(_){idempotencyKey=crypto.randomUUID();}
   const customer={
     full_name:String(data.get('fullName')||'').trim(),
     phone:String(data.get('phone')||'').trim(),
     email:String(data.get('email')||'').trim(),
     district:String(data.get('district')||'').trim(),
     area:String(data.get('area')||'').trim(),
     address:String(data.get('address')||'').trim(),
     notes:String(data.get('notes')||'').trim()
   };
   const items=cart.map(item=>({sku:String(item.id||'').trim(),quantity:Number(item.qty)||1}));
   const {data:order,error}=await client.rpc('create_website_order',{
     p_customer:customer,p_items:items,p_idempotency_key:idempotencyKey
   });
   if(error)throw error;
   if(!order?.success||!order?.order_number)throw new Error('Order confirmation could not be received.');

   const serverLines=cart.map((item,i)=>`${i+1}. ${item.name} (${item.id}) × ${item.qty}`);
   const message=[
     'Hello ZARIAH Studio, I have submitted my website order.',
     `Order Number: ${order.order_number}`,'',
     'CUSTOMER DETAILS',
     `Name: ${customer.full_name}`,`Phone: ${customer.phone}`,
     `Email: ${customer.email||'Not provided'}`,
     `District/City: ${customer.district}`,`Area/Thana: ${customer.area}`,
     `Address: ${customer.address}`,`Notes: ${customer.notes||'None'}`,'',
     'ORDER ITEMS',...serverLines,'',
     `Database-verified subtotal: ${money(order.subtotal_bdt)}`,
     'Delivery: To be confirmed by ZARIAH Studio',
     'Payment: Cash on Delivery','',
     'Please confirm availability and final delivery charge.'
   ].join('\n');
   try{window.ZariahCart.clear();}catch(_){}
   try{sessionStorage.removeItem('zariah_checkout_idempotency_v1');}catch(_){}
   const wa='https://wa.me/8801642779056?text='+encodeURIComponent(message);
   window.location.href=wa;
 }catch(err){
   console.error('[ZARIAH checkout]',err);
   const message=String(err?.message||'').includes('create_website_order')
     ? 'Secure checkout is not active yet. Please contact our team on WhatsApp.'
     : (err?.message||'We could not submit your order. Please try again.');
   alert(message);
   button.disabled=false;
   button.textContent='Continue to WhatsApp to Confirm Order';
 }
});
})();
</script>

<a class="z-floating-bag" href="/pages/cart/" aria-label="Open shopping bag">
  <span class="z-floating-bag-icon" aria-hidden="true">♧</span>
  <span>YOUR BAG</span>
  <span class="z-floating-bag-count" data-cart-count>0</span>
</a>
<style>
.z-floating-bag{position:fixed!important;right:18px!important;bottom:20px!important;z-index:99999!important;display:flex!important;align-items:center!important;gap:9px!important;padding:13px 17px!important;background:#292522!important;color:#fff!important;border:1px solid #c5a06a!important;box-shadow:0 5px 22px #0002!important;text-decoration:none!important;font:500 9px/1 Inter,Arial,sans-serif!important;letter-spacing:.14em!important}
.z-floating-bag-icon{font-size:16px!important;line-height:1!important;color:#e4c99f!important}
.z-floating-bag-count{display:inline-grid!important;place-items:center!important;min-width:19px!important;height:19px!important;padding:0 5px!important;border-radius:50%!important;background:#c5a06a!important;color:#fff!important;font-size:9px!important;letter-spacing:0!important}
@media(max-width:600px){.z-floating-bag{right:12px!important;bottom:14px!important;padding:12px 14px!important}}
</style>




<script src="/assets/js/mini-bag-drawer.js?v=20261109" defer></script>
</body></html>
