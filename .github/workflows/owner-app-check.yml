name: Owner App build check

on:
  push:
    branches:
      - "**"
    paths:
      - 'owner-app/**'
      - '.github/workflows/owner-app-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'owner-app/**'
      - '.github/workflows/owner-app-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-owner-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and install locked dependencies
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Build isolated Owner App
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://keuqvqnhxlpsglsjfopd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            VITE_SUPABASE_ANON_KEY="$(sed -n "s/.*publishableKey: '\\([^']*\\)'.*/\\1/p" ../storefront-config.js)"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: No Supabase Publishable/anon key was found."
            exit 1
          fi
          export VITE_SUPABASE_ANON_KEY
          npm run build
          test -s dist/index.html
          grep -q '/owner/assets/' dist/index.html
