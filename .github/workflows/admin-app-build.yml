name: Admin app build

on:
  pull_request:
    paths:
      - "admin-app/**"
      - ".github/workflows/admin-app-build.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "admin-app/**"
      - ".github/workflows/admin-app-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build admin app
        run: npm run build
