
name: Test BitaServer cPanel API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Test cPanel API connection
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CPANEL_TOKEN" ]; then
            echo "ERROR: API token secret is missing."
            exit 1
          fi

          HTTP_CODE=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -H "Authorization: cpanel zariahstudiо:$CPANEL_TOKEN" \
            "https://s2.myhostnodes.com:2083/execute/Fileman/list_files?dir=public_html")

          echo "HTTP Status: $HTTP_CODE"

          python3 - <<'PY'
          import json
          with open("response.json") as f:
              data = json.load(f)
          print("API Status:", data.get("status"))
          if data.get("errors"):
              print("API Errors:", data["errors"])
          if data.get("status") != 1:
              raise SystemExit("cPanel API test failed")
          print("SUCCESS: cPanel API connection verified.")
          PY
