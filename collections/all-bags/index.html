let products=FALLBACK_PRODUCTS.slice();
const money=n=>'৳'+new Intl.NumberFormat('en-BD',{maximumFractionDigits:0}).format(Number(n||0));
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imageFor(p){const folder=String(p.assetFolder||p.id||p.sku).toLowerCase();return p.remoteImages?.front||'/images/products/'+folder+'/front.webp'}
function render(){const brand=document.getElementById('brandFilter').value,type=document.getElementById('typeFilter').value,sort=document.getElementById('sortFilter').value;const query=(document.getElementById('bagSearchInput')?.value||'').trim().toLowerCase();let list=products.filter(p=>(brand==='all'||String(p.brand||'').trim()===brand)&&(type==='all'||String(p.type||'').trim()===type)&&(!query||[p.name,p.type,p.collection,p.brand,p.sku,p.id].some(v=>String(v||'').toLowerCase().includes(query))));if(sort==='az')list.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='za')list.sort((a,b)=>b.name.localeCompare(a.name));const featured=new URLSearchParams(location.search).get('featured');if(featured==='new'||featured==='bestseller'){const isMatch=p=>{const badge=String(p.badge||'').toLowerCase().replace(/[\\s_-]/g,'');return featured==='new'?(badge==='new'||p.isNew===true||p.is_new===true):(badge==='bestseller'||badge==='bestseller' .replace(/\\s/g,'')||p.isBestseller===true||p.is_bestseller===true)};list=list.filter(isMatch).concat(list.filter(p=>!isMatch(p)));}document.getElementById('resultCount').textContent=`Showing ${list.length} ${list.length===1?'bag':'bags'}`;const grid=document.getElementById('productGrid');grid.innerHTML=list.length?list.map(p=>{const id=p.sku||p.id;const saved=wishlist.includes(String(id))||wishlist.includes(String(p.id));return `<article class="card"><a class="visual" href="/products/${String(id).toLowerCase()}/"><img src="${safe(imageFor(p))}" alt="${safe(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='/images/brand/favicon.png'" decoding="async"><span class="collection-tag">${safe(p.collection)}</span></a><button class="heart" type="button" data-wish="${safe(id)}" aria-label="Add ${safe(p.name)} to wishlist" aria-pressed="${saved}"></button><div class="card-info"><div class="name-price"><h2 class="name">${safe(p.name)}</h2><span class="price">${safe(p.price)}</span></div><p class="type">${safe(p.type||'Handbag')}</p><p class="brand-name">${safe(p.brand||'')}</p><a class="view-link" href="/products/${String(id).toLowerCase()}/">View details&nbsp; →</a><button class="z-card-add-bag" type="button" data-add-bag="${safe(id)}" ${p.soldOut?'disabled':''}>${p.soldOut?'Unavailable':'Add to Bag'}</button></div></article>`}).join(''):'<div class="empty">No bags found in this collection.</div>';grid.querySelectorAll('[data-wish]').forEach(btn=>btn.addEventListener('click',()=>{const id=btn.dataset.wish;wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];try{localStorage.setItem('zariah_wishlist_v1',JSON.stringify(wishlist))}catch(e){}btn.setAttribute('aria-pressed',String(wishlist.includes(id)));}));grid.querySelectorAll('[data-add-bag]').forEach(btn=>btn.addEventListener('click',()=>{const id=btn.dataset.addBag;const product=products.find(item=>String(item.sku||item.id)===id);if(!product||!window.ZariahCart)return;const result=window.ZariahCart.add({id:product.sku||product.id,name:product.name,price:product.price,image:imageFor(product),soldOut:!!product.soldOut});if(!result.ok){btn.textContent=result.reason==='limit'?'Limit reached':'Unavailable';return;}btn.textContent='Added to Bag';btn.setAttribute('aria-label',product.name+' added to bag');window.setTimeout(()=>{if(btn.isConnected)btn.textContent='Add to Bag'},1400);}));}
function price(v){return Number(String(v||'').replace(/[^0-9.]/g,''))||0}
let wishlist=[];try{wishlist=JSON.parse(localStorage.getItem('zariah_wishlist_v1')||'[]');if(!Array.isArray(wishlist))wishlist=[]}catch(e){}
document.getElementById('brandFilter').addEventListener('change',render);document.getElementById('typeFilter').addEventListener('change',render);document.getElementById('sortFilter').addEventListener('change',render);document.getElementById('bagSearchInput').addEventListener('input',render);const mobileSearchToggle=document.getElementById('mobileSearchToggle'),mobileSearchPanel=document.getElementById('mobileSearchPanel'),mobileSearchInput=document.getElementById('mobileBagSearchInput'),mobileSearchClose=document.getElementById('mobileSearchClose'),desktopSearchInput=document.getElementById('bagSearchInput');function closeMobileSearch(){mobileSearchPanel.hidden=true;mobileSearchToggle.setAttribute('aria-expanded','false');mobileSearchToggle.setAttribute('aria-label','Open product search')}mobileSearchToggle.addEventListener('click',()=>{const open=mobileSearchPanel.hidden;mobileSearchPanel.hidden=!open;mobileSearchToggle.setAttribute('aria-expanded',String(open));mobileSearchToggle.setAttribute('aria-label',open?'Close product search':'Open product search');if(open){mobileSearchInput.value=desktopSearchInput.value;mobileSearchInput.focus()}});mobileSearchInput.addEventListener('input',()=>{desktopSearchInput.value=mobileSearchInput.value;desktopSearchInput.dispatchEvent(new Event('input',{bubbles:true}))});mobileSearchClose.addEventListener('click',()=>{mobileSearchInput.value='';desktopSearchInput.value='';desktopSearchInput.dispatchEvent(new Event('input',{bubbles:true}));closeMobileSearch()});
const menuToggle=document.getElementById('menuToggle'),mobileNav=document.getElementById('mobileNav');menuToggle.addEventListener('click',()=>{const open=mobileNav.classList.toggle('open');menuToggle.setAttribute('aria-expanded',String(open));menuToggle.textContent=open?'×':'☰'});
function populateStyleFilter(){const select=document.getElementById('typeFilter');if(!select)return;const current=select.value;const types=[...new Set(products.map(p=>String(p.type||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));select.innerHTML='<option value="all">All styles</option>'+types.map(type=>'<option value="'+safe(type)+'">'+safe(type)+'</option>').join('');if(types.includes(current))select.value=current;}
async function loadCatalogue(){try{const cfg=window.ZARIAH_SUPABASE_CONFIG;if(!cfg||!window.supabase?.createClient)return;const client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:false,autoRefreshToken:false}});const {data,error}=await client.rpc('get_storefront_catalogue');if(error)throw error;if(!Array.isArray(data)||!data.length)return;const bySku=new Map(FALLBACK_PRODUCTS.map(p=>[String(p.id).toLowerCase(),p]));products=data.map(row=>{const fallback=bySku.get(String(row.sku||'').toLowerCase());const remoteImages={};(Array.isArray(row.images)?row.images:[]).forEach(img=>{if(img?.url&&String(img.role||'').toLowerCase()==='front'&&!remoteImages.front)remoteImages.front=img.url});return{id:row.slug||row.sku,sku:row.sku,assetFolder:String(row.sku||'').toLowerCase(),name:row.name||fallback?.name||row.sku,collection:row.collection_name||fallback?.collection||'Essence',type:row.product_type||fallback?.type||'Handbag',badge:row.badge||row.badge_label||fallback?.badge||null,isNew:String(row.badge||row.badge_label||fallback?.badge||'').trim().toLowerCase()==='new'||row.is_new===true,isBestseller:row.is_bestseller===true||String(row.badge||row.badge_label||fallback?.badge||'').toLowerCase().replace(/[\\s_-]/g,'')==='bestseller',price:money(row.price_bdt??price(fallback?.price)),soldOut:row.availability_mode==='pre_order'?false:(row.stock_counted?Boolean(row.is_sold_out):Boolean(fallback?.soldOut)),preOrder:row.availability_mode==='pre_order',remoteImages}});populateStyleFilter();render()}catch(err){console.warn('[ZARIAH] Catalogue fallback active:',err)}}
populateStyleFilter();render();window.ZARIAH_LOAD_SUPABASE().then(loadCatalogue).catch(function(err){console.warn("[ZARIAH] Catalogue fallback active:",err)});
</script>
